name: Release child theme

on:
  push:
    tags:
      - 'v*.*.*'
      - 'studyieltsvn-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install locked dependencies
        run: npm ci
      - name: Package and validate
        run: |
          npm run package
          npm run validate
      - name: Create checksum
        run: sha256sum dist/buddyboss-theme-child.zip > dist/buddyboss-theme-child.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(cut -d' ' -f1 dist/buddyboss-theme-child.zip.sha256)
          gh release create "$GITHUB_REF_NAME" dist/buddyboss-theme-child.zip dist/buddyboss-theme-child.zip.sha256 --title "IELTS Science BuddyBoss Child Theme $GITHUB_REF_NAME" --notes "SHA256: $hash"
